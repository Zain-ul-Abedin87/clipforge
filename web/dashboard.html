<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My videos - ClipForge</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/simple/simple.css">
<link rel="stylesheet" href="/full/full.css">
<style>.dots{display:flex;gap:4px}.dot{width:10px;height:10px;border-radius:50%;background:var(--surface2);border:1px solid var(--border2)}.dot.done{background:var(--ok);border-color:var(--ok)}.dot.running{background:var(--accent);border-color:var(--accent)}.dot.failed{background:var(--bad);border-color:var(--bad)}.dot.skipped{background:var(--dim)}</style>
</head>
<body>
<header id="top"></header>
<main>
  <section class="page">
    <div class="head"><h1>My videos</h1><p class="sub">Every video you started. Continue an unfinished one, open a finished one to watch, download or edit it.</p></div>
    <div class="kpis" id="kpis"></div>
    <div class="card flush" style="margin-top:16px"><div class="scroll"><table class="tbl" id="tbl"><thead><tr><th>Video</th><th>Progress</th><th class="r">Checks</th><th>Updated</th><th></th></tr></thead><tbody></tbody></table></div></div>
    <details class="card" style="margin-top:16px"><summary style="cursor:pointer"><b>Details for the curious</b> <span class="hint">GPU time per AI stage, all videos</span></summary>
      <div class="scroll" style="margin-top:12px"><table class="tbl" id="gpu"><thead><tr><th>Stage</th><th>Model</th><th class="r">Requests</th><th class="r">GPU</th><th class="r">CPU</th><th class="r">Loads</th></tr></thead><tbody></tbody></table></div>
    </details>
  </section>
</main>
<script type="module">
import { api, ago, esc, header, secs } from "/full/full.js";
header();
const $ = (id) => document.getElementById(id);
const d = await api("/api/dashboard");
const TYPE = { ranked: "Ranked list", explainer: "Explainer", tutorial: "Tutorial", documentary: "Documentary", clips: "Shorts from a long video", classic: "Own voice-over" };
const qa = (q) => (q ? `<span class="pill ${q.fail ? "f" : q.warn ? "w" : "p"}" title="ok / to look at / problems">${q.fail ? `${q.fail} problem(s)` : q.warn ? `${q.warn} to look at` : "all ok"}</span>` : '<span class="hint">-</span>');
const done = (p) => p.current === "complete" || !!p.outputs.video;
$("tbl").tBodies[0].innerHTML = d.projects.length
  ? d.projects.map((p) => `<tr>
      <td class="title"><a href="${esc(p.open)}">${esc(p.title)}</a><small>${esc(TYPE[p.type] || p.type)} &middot; ${esc(p.channel)}${p.outputs.shorts.length ? ` &middot; ${p.outputs.shorts.length} Short(s)` : ""}</small></td>
      <td><div class="dots">${d.stages.map((s) => `<span class="dot ${p.stages[s.id]}" title="${esc(s.label)}: ${p.stages[s.id]}"></span>`).join("")}</div><small class="hint">${esc(p.current === "complete" ? "finished" : p.current)}</small></td>
      <td class="r">${qa(p.qa)}</td>
      <td class="hint">${ago(Date.parse(p.updatedAt))}</td>
      <td style="white-space:nowrap;text-align:right"><a class="btn small ${done(p) ? "" : "primary"}" href="${esc(p.open)}">${done(p) ? "Open" : "Continue &rarr;"}</a>${p.edit && p.outputs.video && p.edit !== p.open ? ` <a class="btn small ghost" href="${esc(p.edit)}">Edit</a>` : ""} <a class="btn small ghost" href="/pipeline?project=${encodeURIComponent(p.name)}" title="Every step, its log and time">Details</a></td></tr>`).join("")
  : `<tr><td colspan="5" class="help" style="padding:20px 24px">No videos yet. <a href="/">Make your first one &rarr;</a></td></tr>`;
const gpuTotal = d.gpu.reduce((a, g) => a + g.gpuMs, 0);
$("kpis").innerHTML = [["Videos", d.projects.length], ["Finished", d.projects.filter((p) => p.outputs.video).length], ["Shorts", d.projects.reduce((a, p) => a + p.outputs.shorts.length, 0)], ["GPU time (all)", secs(gpuTotal)]]
  .map(([k, v]) => `<div class="kpi"><b>${v}</b><span>${k}</span></div>`).join("");
$("gpu").tBodies[0].innerHTML = d.gpu.length
  ? d.gpu.sort((a, b) => b.gpuMs - a.gpuMs).map((g) => `<tr><td>${esc(g.stage)}</td><td>${esc(g.model)}</td><td class="r">${g.requests}</td><td class="r">${secs(g.gpuMs)}</td><td class="r">${secs(g.cpuMs)}</td><td class="r">${g.loads}</td></tr>`).join("")
  : `<tr><td colspan="6" class="help" style="padding:16px">No local model time recorded yet.</td></tr>`;
</script>
</body>
</html>
